name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w03-7fbfd3e8161a.tar.gz
      COURSE_KIT_SHA256: 7fbfd3e8161ab6c6ebefc7663efdaf77d9a7d490399743507f33dcefbd5ac522
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Определить лабу
        id: pr
        shell: bash
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          code=$(echo "$ref" | tr '[:lower:]' '[:upper:]')
          echo "code=$code"        >> "$GITHUB_OUTPUT"
          echo "dir=evidence/$ref" >> "$GITHUB_OUTPUT"

      - name: Скачать зафиксированный комплект курса
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit

      # ---------- БАЗОВЫЕ ПРОВЕРКИ (для ВСЕХ лаб) ----------
      - name: Проверить JSON и совпадение версии архива
        shell: bash
        run: |
          python3 -m json.tool "${{ steps.pr.outputs.dir }}/environment.json" > /dev/null
          python3 -m json.tool "${{ steps.pr.outputs.dir }}/report.json" > /dev/null
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('${{ steps.pr.outputs.dir }}/report.json').read_text())
          if report['course_kit']['archive_sha256'] != os.environ['COURSE_KIT_SHA256']:
              raise SystemExit('SHA-256 комплекта в отчёте отличается от архива CI')
          PYTHON
        
          python3 .course-kit/v1/tools/check_practice.py ${{ steps.pr.outputs.code }} --submission .
      
